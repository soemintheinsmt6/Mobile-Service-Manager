name: Build Mobile Service Manager macOS App

on:
  push:
    branches:
      - master

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Enable macOS build
        run: flutter config --enable-macos-desktop

      - name: Build macOS App
        run: flutter build macos --release

      - name: Create installation instructions
        run: |
          cat > INSTALLATION_INSTRUCTIONS.md << 'EOF'
          # Installation Instructions for macOS

          ## The app is unsigned, so you'll need to bypass macOS security checks:

          ### Method 1: Using System Preferences (Recommended)
          1. Download and extract the app
          2. Try to open the app (you'll get a security warning)
          3. Go to **System Preferences** > **Security & Privacy** > **General**
          4. Click **"Open Anyway"** next to the blocked app message
          5. Confirm by clicking **"Open"** in the dialog

          ### Method 2: Using Terminal (Alternative)
          1. Download and extract the app
          2. Open Terminal
          3. Run: `sudo xattr -rd com.apple.quarantine /path/to/mobile_service_manager.app`
          4. Replace `/path/to/` with the actual path to your app
          5. The app should now open normally

          ### Method 3: Disable Gatekeeper Temporarily (Not Recommended)
          1. Open Terminal
          2. Run: `sudo spctl --master-disable`
          3. Install and run the app
          4. Re-enable with: `sudo spctl --master-enable`

          **Note:** This is an unsigned development build. For production use, the app should be properly code-signed and notarized.
          EOF

      - name: Create simple ZIP package
        run: |
          mkdir -p package
          cp -R "build/macos/Build/Products/Release/mobile_service_manager.app" package/
          cp INSTALLATION_INSTRUCTIONS.md package/
          zip -r MobileServiceManager-macOS.zip package/

      - name: Upload macOS Package
        uses: actions/upload-artifact@v4
        with:
          name: mobile-service-manager-macos
          path: MobileServiceManager-macOS.zip