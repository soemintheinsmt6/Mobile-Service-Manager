name: Build Mobile Service Manager Windows App

on:
  push:
    branches:
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows build
        run: flutter config --enable-windows-desktop

      - name: Build Windows App
        run: flutter build windows

      - name: Zip build output
        run: Compress-Archive -Path build/windows/** -DestinationPath mobile-service-manager.zip

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-service-manager
          path: mobile-service-manager.zip